manifest_version: 2
api_version: 1
name: graphify-context
version: 0.2.1
description: Portable Graphify code reuse and impact context; current Profile only.
author: gary3207
license: MIT
kind: standalone
provides_tools: []
provides_hooks: []
platforms: [windows]
tags: [graphify, obsidian, code, reuse, impact]
config_schema:
  vault_path:
    type: str
    description: Existing absolute Obsidian Vault directory; no credentials.
  graphify_folder:
    type: str
    description: Safe Vault-relative Graphify folder, for example AgentData/Graphify.
  extract_timeout_seconds:
    type: int
    default: 300
    description: Positive native extraction timeout in seconds; not a whole-sync timeout.
  project_extract_timeout_seconds:
    type: dict
    default: {}
    description: Optional exact project ID to positive extraction timeout mapping.
  source_exclusions:
    type: dict
    default: {}
    description: Optional exact project ID to source-relative generated-directory patterns; never deletes files.
